[package]
name = "shellman-settings"
version = "0.1.0"
edition.workspace = true
description = "Shellman's settings: one place for the look, the dock, the top bar and the launcher"
license.workspace = true
publish = false

[dependencies]
eframe.workspace = true
egui.workspace = true
raw-window-handle.workspace = true
shellman-buildinfo.workspace = true
shellman-core.workspace = true
shellman-pick.workspace = true
# The system font (the Fonts page): Fontman's logic.
shellman-sysfont = { path = "../../crates/sysfont" }
shellman-ui.workspace = true
# About > Updates: what the last update check found.
shellman-update-core = { path = "../../crates/update" }
windows.workspace = true

[build-dependencies]
shellman-buildinfo.workspace = true
winresource.workspace = true
