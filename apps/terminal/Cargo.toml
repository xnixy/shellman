[package]
name = "shellman-terminal"
version = "0.1.0"
edition.workspace = true
description = "Shellman's terminal: a shell in a glass window"
license.workspace = true
publish = false

[dependencies]
# The grid, the VT parser and ConPTY: see docs/PLAN.md, Terminal.
alacritty_terminal = "0.26"
# Glyphs rasterized by DirectWrite, with its font fallback (what Alacritty uses).
crossfont = "0.9"
eframe.workspace = true
egui.workspace = true
# The grid is drawn with OpenGL inside egui's frame (a paint callback); same versions as eframe's.
egui_glow = "0.31"
glow = "0.16"
# The pty's poll registration, wrapped to read its output on the way (same version as alacritty's).
polling = "3"
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
# Watches the settings folder, so the glass and accent follow Settings live.
shellman-core.workspace = true
shellman-ui.workspace = true
# Win32_System_Pipes: a second start hands its tab to the open window (`instance.rs`).
windows = { workspace = true, features = ["Win32_System_Pipes"] }

[build-dependencies]
winresource.workspace = true
