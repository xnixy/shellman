[package]
name = "shellman-shelf"
version = "0.1.0"
edition.workspace = true
description = "Shellman's shelf: what sits on the wallpaper (the shelf of stacks) and the desktop's right-click menu"
license.workspace = true
publish = false

[dependencies]
# The arrange bar's own screen reader tree (eframe only gives its root window one); the versions
# eframe already uses.
accesskit = "0.17.1"
accesskit_windows = "0.24.1"
eframe.workspace = true
egui.workspace = true
raw-window-handle.workspace = true
shellman-core.workspace = true
shellman-pick.workspace = true
shellman-ui.workspace = true
windows.workspace = true

[build-dependencies]
winresource.workspace = true
