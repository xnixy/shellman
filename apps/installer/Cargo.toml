[package]
name = "shellman-installer"
version = "0.1.0"
edition.workspace = true
description = "Installs and removes shellman: one exe with every file inside, and a glass wizard"
license.workspace = true
publish = false

[dependencies]
eframe.workspace = true
egui.workspace = true
# The payload is deflated (already in the build for eframe's PNG icons).
flate2 = "1"
raw-window-handle.workspace = true
shellman-buildinfo.workspace = true
shellman-setup = { path = "../setup" }
shellman-ui.workspace = true
# The Firefox look (the wizard's "Also style Firefox", the uninstaller's removal); already built for shellman-ui.
shellman-core.workspace = true
windows.workspace = true

[dev-dependencies]
# The updater checks a downloaded installer's payload with its own copy of the footer reader.
shellman-update-core = { path = "../../crates/update" }

[build-dependencies]
shellman-buildinfo.workspace = true
winresource.workspace = true
