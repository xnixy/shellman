[package]
name = "shellman-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "shellman_core"

[dependencies]
dirs.workspace = true
egui.workspace = true
png.workspace = true
# Toast XML (notifications): small, pure Rust, no dependencies.
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
# The Firefox look records its loader files' SHA-256, as install.ps1 does (already built for updates).
sha2 = "0.10"
# Task Manager (`procs`): counters, process memory, and the GPUs' names and memory sizes.
windows = { workspace = true, features = ["Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_System_UpdateAgent", "Win32_Networking_WinHttp", "Win32_Security_Credentials"] }
# Windows Update (`system::wu_api`, generated): its lists are this crate's vector views.
windows-collections = "0.2"
windows-core.workspace = true
windows-future.workspace = true
# Draws SVG icon packs. No text, no system fonts, no embedded rasters: icons are plain paths.
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
# `examples/open_probe.rs` (opening speed): an OpenGL and a Direct3D 11 device, for comparison.
windows = { workspace = true, features = ["Win32_Graphics_OpenGL", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11"] }
