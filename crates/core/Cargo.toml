[package]
name = "shellman-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "shellman_core"

[dependencies]
dirs.workspace = true
egui.workspace = true
# Toast XML (notifications): small, pure Rust, no dependencies.
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
windows.workspace = true
windows-core.workspace = true
windows-future.workspace = true
# Draws SVG icon packs. No text, no system fonts, no embedded rasters: icons are plain paths.
resvg = { version = "0.45", default-features = false }
