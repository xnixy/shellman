[package]
name = "shellman-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "shellman_core"

[dependencies]
dirs.workspace = true
egui.workspace = true
# Toast XML (notifications): small, pure Rust, no dependencies.
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
# Task Manager (`procs`): counters, process memory, and the GPUs' names and memory sizes.
windows = { workspace = true, features = ["Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-core.workspace = true
windows-future.workspace = true
