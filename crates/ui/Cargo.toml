[package]
name = "shellman-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "shellman_ui"

[dependencies]
shellman-core.workspace = true
shellman-icons.workspace = true
egui.workspace = true
# Opening-speed timing (`timing`): a paint callback marks when a frame was painted. Same version
# as eframe's.
egui_glow = { version = "0.31", default-features = false }
# Screen readers for windows eframe does not give AccessKit (`access`): the versions eframe uses.
accesskit = "0.17.1"
accesskit_windows = "0.24.1"
serde.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
    # Floating glass (`glass`): a composition tree with the host backdrop, on a DispatcherQueue.
    "Foundation",
    "Foundation_Numerics",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
] }
# The vector types composition takes; `windows` uses them without re-exporting them.
windows-numerics = "0.2"

[dev-dependencies]
serde_json.workspace = true
# The popup menu's example (`examples/popup_menu.rs`) runs in a real eframe app.
eframe.workspace = true
raw-window-handle.workspace = true
