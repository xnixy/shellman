[package]
name = "shellman-firefox-glass"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# shellman_glass.dll: shellman's floating glass (crates/ui glass::GlassPanel) under a Firefox
# window, loaded by integrations/firefox/chrome/shellman-scripts/shellman-glass.sys.mjs through
# js-ctypes. A plain C ABI, see src/lib.rs.
[lib]
name = "shellman_glass"
crate-type = ["cdylib"]

[dependencies]
shellman-ui.workspace = true
egui.workspace = true
windows = { workspace = true, features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
