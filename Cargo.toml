[workspace]
members = ["crates/*", "apps/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellman-core = { path = "crates/core" }
shellman-ui = { path = "crates/ui" }
# Embeds each app's icon as its exe's Win32 icon resource (see each app's build.rs).
winresource = "0.1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Power",
    "Win32_Globalization",
    "Win32_Graphics_Imaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Dependencies (egui, image decoding) are far too slow unoptimized; our own code stays quick to build.
[profile.dev.package."*"]
opt-level = 2
